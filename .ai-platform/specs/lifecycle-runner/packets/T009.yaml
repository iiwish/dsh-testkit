schema_version: 1
packet_id: EP-LIFECYCLE-T009
task_id: T009
feature_id: lifecycle-runner
mode: execute_one_task
adapter: codex
governance_inputs:
  constitution: .ai-platform/memory/constitution.md
  product_contract: .ai-platform/docs/product-design.md
  feature_spec: .ai-platform/specs/lifecycle-runner/spec.md
  requirements_checklist: .ai-platform/specs/lifecycle-runner/checklists/requirements.md
  technical_decisions: .ai-platform/docs/technology-decision-record.md
  feature_plan: .ai-platform/specs/lifecycle-runner/plan.md
  work_graph: .ai-platform/specs/lifecycle-runner/tasks.md
  analysis: .ai-platform/specs/lifecycle-runner/analysis.md
  approval_gates:
    constitution: Confirmed
    product_or_spec: Confirmed
    technical_plan_and_work_graph: Confirmed
    pilot: User approved the bounded first design-partner pilot and nested plugin-root correction on 2026-08-16
work_unit:
  title: Nested plugin root and first design-partner pilot
  goal: Keep plugin configuration beside a nested DSH bundle while placing repository integrations where GitHub and agents discover them, then validate two exact partner releases without treating the result as market proof.
  epic: E001
  story: US-009
  requirements: [FR-037, FR-038, FR-039, NFR-019, NFR-020, SC-021]
  priority: P1
  depends_on: [T008]
  blocks: [first design-partner adoption evidence]
  parallel: false
  conflicts_with: []
codebase_context:
  local_instructions: [AGENTS.md]
  relevant_files:
    - src/scaffold/init.ts
    - src/cli.ts
    - tests/unit/scaffold.test.ts
    - tests/integration/cli.test.ts
    - tests/contracts/documentation.test.ts
    - README.md
    - README.zh-CN.md
  existing_patterns:
    - init parses package.json and dsh.bundle.patch structurally and performs no network or package execution.
    - All scaffold targets are preflighted before any target is written.
    - Scenario-relative subject resolution uses the scenario file directory as its base.
    - GitHub discovers workflows only at repository-root .github/workflows.
  interfaces_or_contracts:
    - dsh-test init [plugin-directory] [--repo-root repository-directory] [--dsh exact-version] [--force]
    - plugin-root dsh-testkit.yaml with subject.source set to dot
    - repository-root .github/workflows/dsh-lifecycle.yml
    - repository-root .agents/skills/dsh-testkit/SKILL.md
  forbidden_changes:
    - Do not add multi-plugin orchestration, workflow merging, marketplace behavior or model evaluation.
    - Do not install dependencies, run package scripts, access the network or edit manifests, lockfiles or AGENTS.md during init.
    - Do not publish named partner failure claims before reproducibility and maintainer confirmation.
    - Do not publish npm or move release tags in this task.
    - Do not add, modify or commit the user-owned AGENTS.md file.
execution_constraints:
  branch_or_worktree: agent/pilot1-nested-plugin
  allowed_files:
    - .ai-platform/**
    - src/scaffold/init.ts
    - src/cli.ts
    - tests/unit/scaffold.test.ts
    - tests/integration/cli.test.ts
    - tests/contracts/documentation.test.ts
    - README.md
    - README.zh-CN.md
    - CHANGELOG.md
    - docs/**
  test_targets:
    - tests/unit/scaffold.test.ts
    - tests/integration/cli.test.ts
    - tests/contracts/documentation.test.ts
  ownership_notes:
    - Preserve the untracked AGENTS.md exactly as found.
    - The repository root contains the real plugin root after realpath resolution.
    - All three target paths are repository-relative and one shared preflight completes before writes.
tdd_plan:
  required: true
  red:
    command: pnpm vitest run tests/unit/scaffold.test.ts tests/integration/cli.test.ts tests/contracts/documentation.test.ts
    expected_failure: The root-only scaffold writes workflow and Skill under a nested plugin and cannot render repository-relative Action inputs.
  green:
    command: pnpm vitest run tests/unit/scaffold.test.ts tests/integration/cli.test.ts tests/contracts/documentation.test.ts
    expected_signal: Root and nested layouts, explicit root, containment, atomicity and bilingual documentation contracts pass.
  refactor:
    command: pnpm validate && pnpm test:pack
    expected_signal: Existing lifecycle, package and root scaffold contracts remain green.
validation_loop:
  commands:
    - pnpm vitest run tests/unit/scaffold.test.ts tests/integration/cli.test.ts tests/contracts/documentation.test.ts
    - pnpm validate
    - pnpm test:pack
    - python3 /Users/iiwish/.codex/skills/ai-delivery-governor/scripts/validate_delivery_artifacts.py --root . --feature-id lifecycle-runner --task-id T009
  retry_budget: 3
  failure_policy:
    first_failure: Fix the smallest root-resolution, rendering, containment or documentation defect within scope.
    second_failure: Recheck worktree markers, symlink handling and scenario-relative path assumptions and add focused evidence.
    third_failure: Preserve evidence and stop without weakening transaction or containment rules.
    beyond_budget: Stop and record blocked evidence.
evidence_contract:
  summary: .ai-platform/evidence/T009/summary.md
  diff: .ai-platform/evidence/T009/diff.patch
  test_results: .ai-platform/evidence/T009/test-results.md
  required: [RED and GREEN results, full validation, exact partner tag identities, generated path checks, disclosure boundary, residual risks]
review_contract:
  required_passes: [spec_compliance, bug_code_quality, scaffold_safety, documentation_parity, pilot_evidence]
  acceptance_rule: Nested initialization must be backward compatible and transactional; partner evidence is technical compatibility only and npm publication needs separate user approval.
handoff:
  external_issue: https://github.com/deepseek-ai/deepseek-harness/discussions/2038
  pull_request: null
  finish_options: [open reviewed pull request, merge after CI, prepare maintainer follow-up, defer package release]
stop_conditions: [repository root does not contain plugin root, scaffold can escape or partially write, existing root behavior regresses, partner identity cannot be pinned, named failure disclosure lacks maintainer confirmation]
