name: DSH Testkit
description: Run a real-host lifecycle test for a DSH plugin and retain structured evidence.
inputs:
  plugin:
    description: Plugin directory, tarball, exact npm spec, or Git spec pinned to a full commit SHA.
    required: true
  dsh-version:
    description: Exact @deepseek-ai/dsh npm version.
    required: true
  config:
    description: Optional scenario YAML or JSON path relative to the workspace.
    required: false
    default: ''
  output:
    description: Evidence directory relative to the workspace. A unique path is derived when empty.
    required: false
    default: ''
  artifact-name:
    description: Uploaded artifact name. A matrix-safe name is derived when empty.
    required: false
    default: ''
  check-name:
    description: JUnit check name. A subject-specific name is derived when empty.
    required: false
    default: ''
  publish-junit-check:
    description: 'Publish a Checks API result. Requires checks: write and should only be enabled for trusted workflows.'
    required: false
    default: 'false'
  artifact-retention-days:
    description: Number of days to retain lifecycle evidence.
    required: false
    default: '14'
  args:
    description: Legacy whitespace-delimited dsh-test arguments without quoting.
    required: false
    default: ''
  args-json:
    description: Additional dsh-test arguments as a JSON array of strings.
    required: false
    default: '[]'
outputs:
  report:
    description: Canonical JSON report path.
    value: ${{ steps.paths.outputs.report }}
  exit-code:
    description: Stable dsh-test exit code.
    value: ${{ steps.lifecycle.outputs.exit-code }}
  output:
    description: Resolved evidence directory relative to the workspace.
    value: ${{ steps.paths.outputs.output }}
  artifact-name:
    description: Uploaded artifact name.
    value: ${{ steps.paths.outputs.artifact-name }}
  artifact-id:
    description: GitHub artifact ID.
    value: ${{ steps.evidence.outputs.artifact-id }}
  artifact-url:
    description: GitHub artifact URL.
    value: ${{ steps.evidence.outputs.artifact-url }}
  artifact-digest:
    description: GitHub artifact SHA-256 digest.
    value: ${{ steps.evidence.outputs.artifact-digest }}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11.1.3
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - name: Build DSH Testkit
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: pnpm install --frozen-lockfile && pnpm build
    - id: paths
      shell: bash
      env:
        INPUT_PLUGIN: ${{ inputs.plugin }}
        INPUT_DSH_VERSION: ${{ inputs.dsh-version }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        INPUT_CHECK_NAME: ${{ inputs.check-name }}
      run: node "$GITHUB_ACTION_PATH/../../../dist/src/action/identity.js"
    - id: lifecycle
      name: Run lifecycle test
      continue-on-error: true
      shell: bash
      env:
        INPUT_PLUGIN: ${{ inputs.plugin }}
        INPUT_DSH_VERSION: ${{ inputs.dsh-version }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_ARGS_JSON: ${{ inputs.args-json }}
        RESOLVED_OUTPUT: ${{ steps.paths.outputs.output }}
      run: node "$GITHUB_ACTION_PATH/../../../dist/src/action/run.js"
    - name: Publish JUnit
      if: always()
      uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
      with:
        report_paths: ${{ github.workspace }}/${{ steps.paths.outputs.output }}/junit.xml
        check_name: ${{ steps.paths.outputs.check-name }}
        fail_on_failure: false
        annotate_only: ${{ inputs.publish-junit-check != 'true' }}
    - name: Upload lifecycle evidence
      id: evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.paths.outputs.artifact-name }}
        path: ${{ github.workspace }}/${{ steps.paths.outputs.output }}
        if-no-files-found: error
        retention-days: ${{ inputs.artifact-retention-days }}
    - name: Enforce lifecycle verdict
      if: always()
      shell: bash
      env:
        EXIT_CODE: ${{ steps.lifecycle.outputs.exit-code }}
      run: exit "${EXIT_CODE:-3}"
