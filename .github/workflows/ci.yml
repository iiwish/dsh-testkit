name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lifecycle: ${{ steps.filter.outputs.lifecycle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Detect lifecycle-impacting changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          lifecycle=false
          while IFS= read -r file; do
            if [[ "$file" =~ ^(src/|tests/|fixtures/|assets/|schemas/|scripts/|cordis\.patch\.yml$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.json$|vitest\.config\.ts$|\.github/actions/|\.github/workflows/) ]]; then
              lifecycle=true
              break
            fi
          done < <(git diff --name-only "$base" "$GITHUB_SHA")
          echo "lifecycle=$lifecycle" >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

  real-host:
    needs: [changes, validate]
    runs-on: ubuntu-latest
    env:
      DSH_TESTKIT_DSH_VERSION: 0.1.1-rc.2
    steps:
      - name: Preserve required check for documentation-only changes
        if: github.event_name == 'pull_request' && needs.changes.outputs.lifecycle != 'true'
        run: echo 'No lifecycle-impacting changes; real-host execution is not required.'
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        run: pnpm test:e2e
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-testkit-evidence
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        run: pnpm test:bundle-e2e
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-testkit-evidence
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        run: pnpm test:pack
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-testkit-evidence

      - id: safety
        name: Prepare safe evidence
        if: always() && (github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true')
        env:
          EVIDENCE_INPUT: ${{ runner.temp }}/dsh-testkit-evidence
        run: node scripts/prepare-evidence.mjs "$EVIDENCE_INPUT" --allow-missing
      - id: evidence
        name: Retain checked evidence
        if: always() && steps.safety.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-formal-default
          path: ${{ steps.safety.outputs.path }}
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14

  real-host-compat:
    needs: [changes, validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh-version: [0.1.5-rc.1, 0.1.2-rc.1, 0.1.0-rc.8, 0.1.0-rc.7, 0.1.0-rc.6]
    env:
      DSH_TESTKIT_DSH_VERSION: ${{ matrix.dsh-version }}
    steps:
      - name: Preserve required check for documentation-only changes
        if: github.event_name == 'pull_request' && needs.changes.outputs.lifecycle != 'true'
        run: echo 'No lifecycle-impacting changes; compatibility real-host execution is not required.'
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        run: pnpm install --frozen-lockfile
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        run: pnpm test:e2e
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-testkit-evidence
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        run: pnpm test:bundle-e2e
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-testkit-evidence
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        run: pnpm test:pack
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-testkit-evidence

      - id: safety
        name: Prepare safe evidence
        if: always() && (github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true')
        env:
          EVIDENCE_INPUT: ${{ runner.temp }}/dsh-testkit-evidence
        run: node scripts/prepare-evidence.mjs "$EVIDENCE_INPUT" --allow-missing
      - id: evidence
        name: Retain checked evidence
        if: always() && steps.safety.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-formal-${{ matrix.dsh-version }}
          path: ${{ steps.safety.outputs.path }}
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14

  adoption:
    needs: [changes, validate]
    if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bugmaker2/dsh-plugin-template
          ref: 31af7ebeb8d07cff73253f52f9a9f530cde9de9a
          path: .adoption-subject
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:adoption -- .adoption-subject
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-adoption-evidence
      - id: safety
        if: always()
        name: Prepare adoption evidence
        run: node scripts/prepare-evidence.mjs "$EVIDENCE_INPUT" --allow-missing
        env:
          EVIDENCE_INPUT: ${{ runner.temp }}/dsh-adoption-evidence
      - if: always() && steps.safety.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-adoption
          path: ${{ steps.safety.outputs.path }}
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14
      - uses: ./.github/actions/dsh-test
        with:
          plugin: .adoption-subject
          config: .adoption-subject/dsh-testkit.yaml
          dsh-version: 0.1.2-rc.1
          publish-junit-check: 'false'
          artifact-retention-days: '14'

  action-smoke:
    needs: [changes, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: fixtures/healthy-plugin
            config: fixtures/healthy-plugin/dsh-testkit.yaml
          - plugin: fixtures/boot-failure-plugin
            config: fixtures/boot-failure-plugin/dsh-testkit.yaml
    steps:
      - name: Preserve required check for documentation-only changes
        if: github.event_name == 'pull_request' && needs.changes.outputs.lifecycle != 'true'
        run: echo 'No lifecycle-impacting changes; Action smoke execution is not required.'
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        uses: ./.github/actions/dsh-test
        with:
          plugin: ${{ matrix.plugin }}
          dsh-version: 0.1.1-rc.2
          config: ${{ matrix.config }}
          artifact-retention-days: '14'

  action-smoke-compat:
    needs: [changes, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: fixtures/healthy-plugin
            dsh-version: 0.1.5-rc.1
          - plugin: fixtures/boot-failure-plugin
            dsh-version: 0.1.5-rc.1
          - plugin: fixtures/healthy-plugin
            dsh-version: 0.1.0-rc.8
          - plugin: fixtures/healthy-plugin
            dsh-version: 0.1.2-rc.1
          - plugin: fixtures/boot-failure-plugin
            dsh-version: 0.1.2-rc.1
          - plugin: fixtures/boot-failure-plugin
            dsh-version: 0.1.0-rc.8
          - plugin: fixtures/healthy-plugin
            dsh-version: 0.1.0-rc.7
          - plugin: fixtures/boot-failure-plugin
            dsh-version: 0.1.0-rc.7
          - plugin: fixtures/healthy-plugin
            dsh-version: 0.1.0-rc.6
          - plugin: fixtures/boot-failure-plugin
            dsh-version: 0.1.0-rc.6
    steps:
      - name: Preserve compatibility check for documentation-only changes
        if: github.event_name == 'pull_request' && needs.changes.outputs.lifecycle != 'true'
        run: echo 'No lifecycle-impacting changes; compatibility Action smoke execution is not required.'
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name == 'push' || needs.changes.outputs.lifecycle == 'true'
        uses: ./.github/actions/dsh-test
        with:
          plugin: ${{ matrix.plugin }}
          dsh-version: ${{ matrix.dsh-version }}
          config: ${{ matrix.plugin }}/dsh-testkit.yaml
          artifact-retention-days: '14'
