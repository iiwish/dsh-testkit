name: DSH Release Watch

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      canary_versions: ${{ steps.release-train.outputs.canary_versions }}
      has_canaries: ${{ steps.release-train.outputs.has_canaries }}
      pending_npm_versions: ${{ steps.release-train.outputs.pending_npm_versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: release-train
        name: Discover unseen DSH releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-dsh-release-train.mjs
      - name: Record official releases waiting for npm
        if: steps.release-train.outputs.has_pending_npm == 'true'
        env:
          PENDING_NPM_VERSIONS: ${{ steps.release-train.outputs.pending_npm_versions }}
        run: echo "Official DSH releases waiting for exact npm packages - $PENDING_NPM_VERSIONS" >> "$GITHUB_STEP_SUMMARY"

  canary:
    needs: discover
    if: needs.discover.outputs.has_canaries == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dsh: ${{ fromJSON(needs.discover.outputs.canary_versions) }}
        lane: [lifecycle, bundle]
    env:
      DSH_TESTKIT_DSH_VERSION: ${{ matrix.dsh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable candidate in this disposable checkout
        run: node scripts/enable-dsh-canary.mjs "$DSH_TESTKIT_DSH_VERSION"
      - if: matrix.lane == 'lifecycle'
        run: pnpm test:e2e
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-testkit-evidence
      - if: matrix.lane == 'bundle'
        run: pnpm test:bundle-e2e
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-testkit-evidence
      - id: safety
        name: Prepare safe evidence
        if: always()
        env:
          EVIDENCE_INPUT: ${{ runner.temp }}/dsh-testkit-evidence
        run: node scripts/prepare-evidence.mjs "$EVIDENCE_INPUT" --allow-missing
      - name: Retain canary evidence
        if: always() && steps.safety.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-canary-${{ matrix.dsh }}-${{ matrix.lane }}
          path: ${{ steps.safety.outputs.path }}
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 14

  summary:
    if: always()
    needs: [discover, canary]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Summarize monitoring result
        env:
          DISCOVERY_RESULT: ${{ needs.discover.result }}
          CANARY_RESULT: ${{ needs.canary.result }}
          CANARY_VERSIONS: ${{ needs.discover.outputs.canary_versions }}
          PENDING_NPM_VERSIONS: ${{ needs.discover.outputs.pending_npm_versions }}
        run: node scripts/summarize-dsh-release-watch.mjs
