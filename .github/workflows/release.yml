name: Release npm Package

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin trusted-publishing npm client
        run: npm install --global npm@11.19.0
      - name: Verify release identity
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test:e2e
      - run: pnpm test:bundle-e2e
      - run: pnpm test:pack
      - name: Publish with npm Trusted Publishing
        run: npm publish --access public
      - name: Verify public package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            published="$(npm view "dsh-testkit@$version" version 2>/dev/null || true)"
            [[ "$published" == "$version" ]] && exit 0
            sleep $((attempt * 5))
          done
          echo "dsh-testkit@$version was not visible from the public registry" >&2
          exit 1
