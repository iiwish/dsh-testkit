name: Release npm Package

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin trusted-publishing npm client
        run: npm install --global npm@11.19.0
      - name: Verify release identity
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test:e2e
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-testkit-evidence
      - run: pnpm test:bundle-e2e
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-testkit-evidence
      - run: pnpm test:pack
        env:
          DSH_TESTKIT_E2E_OUTPUT: ${{ runner.temp }}/dsh-testkit-evidence
      - id: safety
        name: Prepare safe evidence
        if: always()
        env:
          EVIDENCE_INPUT: ${{ runner.temp }}/dsh-testkit-evidence
        run: node scripts/prepare-evidence.mjs "$EVIDENCE_INPUT" --allow-missing
      - id: evidence
        name: Retain checked evidence
        if: always() && steps.safety.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dsh-release-evidence
          path: ${{ steps.safety.outputs.path }}
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14
      - name: Publish with npm Trusted Publishing
        run: npm publish --access public
      - name: Verify public package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            published="$(npm view "dsh-testkit@$version" version 2>/dev/null || true)"
            [[ "$published" == "$version" ]] && exit 0
            sleep $((attempt * 5))
          done
          echo "dsh-testkit@$version was not visible from the public registry" >&2
          exit 1
